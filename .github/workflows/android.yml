name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY" > local.properties
        printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET" >> local.properties
        printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER" >> local.properties

        if [ -z "$KEYSTORE_BASE64" ]; then
          echo '::error::KEYSTORE_BASE64 is empty or unavailable to this workflow.'
          exit 1
        fi
        if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
          echo '::error::One or more signing secrets are empty. Set KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Actions secrets.'
          exit 1
        fi
        if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > melora-release.jks; then
          echo '::error::KEYSTORE_BASE64 is not valid Base64. Encode the complete melora-release.jks file and replace that secret.'
          exit 1
        fi
        if ! keytool -list -keystore melora-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
          echo '::error::The keystore cannot be opened with KEYSTORE_PASSWORD and KEY_ALIAS. Confirm both secrets match keystore.properties.'
          exit 1
        fi
        if ! keytool -certreq -keystore melora-release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/melora-release.csr" -noprompt >/dev/null 2>&1; then
          echo '::error::KEY_PASSWORD does not unlock the signing key for KEY_ALIAS. Confirm the secret matches keystore.properties.'
          exit 1
        fi
        rm -f "$RUNNER_TEMP/melora-release.csr"
        {
          printf 'storeFile=melora-release.jks\n'
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
          printf 'keyAlias=%s\n' "$KEY_ALIAS"
          printf 'keyPassword=%s\n' "$KEY_PASSWORD"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: melora-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk

    # Built by the same assembleProdRelease, with the same key. The watch app
    # only pairs with a phone app signed by the same key, so a prod watch APK
    # for these phone builds can only come from here, never a local build.
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: melora-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk
