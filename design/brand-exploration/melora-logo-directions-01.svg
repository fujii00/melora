<path d="M233 585h32l23-58 35 115 35-92 22 35h54" fill="none" stroke="url(#pulse)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
<text x="124" y="775" fill="#f4f4ef" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="650">melora</text>
<text x="124" y="813" fill="#aeb2bb" font-family="Inter,Arial,sans-serif" font-size="17">Bright, rhythmic, unmistakable at a glance.</text>
<rect x="124" y="854" width="176" height="70" rx="18" fill="#f4f3ef"/><path d="M151 890h14l10-23 14 46 14-36 9 13h23" fill="none" stroke="#22262e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
