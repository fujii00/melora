<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111319"/><stop offset="1" stop-color="#1c2029"/></linearGradient>
 <linearGradient id="pulse" x2="1" y2="1"><stop stop-color="#c6f06d"/><stop offset="1" stop-color="#70d6c5"/></linearGradient>
 <linearGradient id="sleeve" x2="1" y2="1"><stop stop-color="#fb8c76"/><stop offset="1" stop-color="#f6c67c"/></linearGradient>
 <linearGradient id="orbit" x2="1" y2="1"><stop stop-color="#8d9cff"/><stop offset="1" stop-color="#d4a6f5"/></linearGradient>
