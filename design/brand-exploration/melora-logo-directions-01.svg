<circle cx="1284" cy="583" r="11" fill="#f4f1ff"/>
<text x="1092" y="775" fill="#f4f4ef" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="650">melora</text>
<text x="1092" y="813" fill="#aeb2bb" font-family="Inter,Arial,sans-serif" font-size="17">Calm, considered, clear in small sizes.</text>
<rect x="1092" y="854" width="176" height="70" rx="18" fill="#f4f3ef"/><circle cx="1180" cy="889" r="20" fill="none" stroke="#22262e" stroke-width="5" stroke-dasharray="85 42" stroke-linecap="round" transform="rotate(-34 1180 889)"/><circle cx="1180" cy="889" r="4" fill="#22262e"/>
