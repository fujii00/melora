<text x="608" y="328" fill="#f6a48e" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">02  /  SLEEVE</text>
<text x="608" y="371" fill="#f4f4ef" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650">A collection, held close</text>
<text x="608" y="406" fill="#aeb2bb" font-family="Inter,Arial,sans-serif" font-size="17">A soft frame with a path through its center.</text>
<rect x="671" y="454" width="258" height="258" rx="62" fill="#171a20" stroke="#343943"/>
<path d="M735 634V532q0-15 16-15h100q16 0 16 15v102q0 15-16 15H751q-16 0-16-15Z" fill="none" stroke="url(#sleeve)" stroke-width="13"/>
<path d="M757 612l35-59 32 46 23-29" fill="none" stroke="#f3eee6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="849" cy="548" r="7" fill="#f6a48e"/>
<text x="608" y="775" fill="#f4f4ef" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="650">melora</text>
<text x="608" y="813" fill="#aeb2bb" font-family="Inter,Arial,sans-serif" font-size="17">Warm, tactile, shaped around owned music.</text>
<rect x="608" y="854" width="176" height="70" rx="18" fill="#f4f3ef"/><path d="M653 910v-32h62v32h-62Z" fill="none" stroke="#22262e" stroke-width="6"/><path d="M665 902l14-17 13 13 10-10" fill="none" stroke="#22262e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="805" y="894" fill="#969ba6" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="1.2">ONE-COLOR TEST</text>
