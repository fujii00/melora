<g filter="url(#shadow)"><rect x="1056" y="272" width="456" height="710" rx="30" fill="#20242d" stroke="#353a45"/></g>
<text x="1092" y="328" fill="#b4adff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">03  /  ORBIT</text>
<text x="1092" y="371" fill="#f4f4ef" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650">Your sound, your world</text>
<text x="1092" y="406" fill="#aeb2bb" font-family="Inter,Arial,sans-serif" font-size="17">A centered note held by quiet sound rings.</text>
<rect x="1155" y="454" width="258" height="258" rx="62" fill="#171a20" stroke="#343943"/>
<circle cx="1284" cy="583" r="49" fill="none" stroke="url(#orbit)" stroke-width="12" stroke-dasharray="206 102" stroke-linecap="round" transform="rotate(-34 1284 583)"/>
