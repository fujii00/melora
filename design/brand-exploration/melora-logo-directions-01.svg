</defs>
<rect width="1600" height="1120" fill="url(#bg)"/>
<text x="92" y="94" fill="#f5f4f0" font-family="Inter,Arial,sans-serif" font-size="20" letter-spacing="4" font-weight="600">MELORA  /  IDENTITY EXPLORATION 01</text>
<text x="92" y="166" fill="#f8f7f4" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="650">A home for the music you keep.</text>
<text x="94" y="213" fill="#a7aab4" font-family="Inter,Arial,sans-serif" font-size="22">Three early marks: streaming energy, editorial calm, and a personal local library.</text>
<!-- card 1 -->
<g filter="url(#shadow)"><rect x="88" y="272" width="456" height="710" rx="30" fill="#20242d" stroke="#353a45"/></g>
<text x="124" y="328" fill="#c6f06d" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">01  /  SIGNAL</text>
<text x="124" y="371" fill="#f4f4ef" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="650">Sound, in motion</text>
<text x="124" y="406" fill="#aeb2bb" font-family="Inter,Arial,sans-serif" font-size="17">An open pulse that feels alive and yours.</text>
